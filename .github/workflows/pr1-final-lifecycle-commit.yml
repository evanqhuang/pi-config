name: Commit final managed review lifecycle fixes

on:
  push:
    branches:
      - feat/stateful-code-review-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix managed review lifecycle safety'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/pi-code-review/package-lock.json
      - name: Apply lifecycle patch and strict typing fixes
        run: |
          git show 920a24bae6bf93aa57fda4554061dc6e98f380df:.github/workflows/pr1-final-lifecycle-apply.yml > /tmp/apply-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/apply-workflow.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<final-lifecycle-apply>', 'exec'))

          lifecycle_path = Path('dev/pi-code-review/src/lifecycle.ts')
          lifecycle = lifecycle_path.read_text()
          lifecycle = lifecycle.replace(
              'async function managedSnapshot(input: ManagedReviewRunInput, phase:',
              'async function managedSnapshot(input: ManagedReviewRunInput & { readonly target: ReviewTarget }, phase:',
              1,
          )
          lifecycle = lifecycle.replace('current.lastReviewedHead = snapshot.headSha;', 'current.lastReviewedHead = snapshot.headSha!;', 1)
          lifecycle = lifecycle.replace('current.initialReviewedHead ??= snapshot.headSha;', 'current.initialReviewedHead ??= snapshot.headSha!;', 1)
          lifecycle = lifecycle.replace('withLock(found.path,', 'withLedgerLock(found.path,')
          lifecycle_path.write_text(lifecycle)

          test_path = Path('dev/pi-code-review/test/lifecycle.test.ts')
          tests = test_path.read_text()
          tests = tests.replace('public onRun?: () => void;', 'public onRun: (() => void) | undefined;', 1)
          tests = tests.replace('this.onRun = undefined;', 'delete this.onRun;', 1)
          tests = tests.replace('sessionId: initial.sessionId,', 'sessionId: initial.sessionId!,')
          test_path.write_text(tests)

          Path('.github/workflows/pr1-final-lifecycle-commit.yml').unlink(missing_ok=True)
          PY
      - name: Install dependencies
        working-directory: dev/pi-code-review
        run: npm ci
      - name: Typecheck and test
        working-directory: dev/pi-code-review
        run: npm run check
      - name: Verify scope and formatting
        run: |
          git diff --check
          test -z "$(git diff --name-only origin/main...HEAD -- agents/Plan.md dev/pi-plan-mode settings.json)"
      - name: Commit fixes
        run: |
          git config user.name "Evan Huang"
          git config user.email "evanhuang117@gmail.com"
          git add -A
          git commit -m "Fix managed review lifecycle safety"
          git push origin HEAD:feat/stateful-code-review-convergence
