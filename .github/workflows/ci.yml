name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PI_CODING_AGENT_DIR: ${{ github.workspace }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: pi-code-review
            directory: dev/pi-code-review
            install: npm ci
            check: npm run check
          - package: pi-notes
            directory: dev/pi-notes
            install: npm install
            check: npm run check
          - package: pi-plan-mode
            directory: dev/pi-plan-mode
            install: npm ci
            check: npm run typecheck && npm test
          - package: pi-subagents-local
            directory: dev/pi-subagents-local
            install: npm ci
            check: npm run check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.install }}

      - name: Prepare pi-plan-mode integration environment
        if: matrix.package == 'pi-plan-mode'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat

          npm install --prefix "$GITHUB_WORKSPACE/npm" --no-save context-mode

          sudo mkdir -p \
            /Users/evanhuang/.pi/agent/dev \
            /Users/evanhuang/.pi/agent/npm/node_modules \
            /opt/homebrew/lib
          sudo ln -s "$GITHUB_WORKSPACE/dev/pi-plan-mode" /Users/evanhuang/.pi/agent/dev/pi-plan-mode
          sudo ln -s "$GITHUB_WORKSPACE/npm/node_modules/context-mode" /Users/evanhuang/.pi/agent/npm/node_modules/context-mode
          sudo npm install --prefix /opt/homebrew/lib @earendil-works/pi-coding-agent@0.84.3

      - name: Prepare pi-subagents-local integration environment
        if: matrix.package == 'pi-subagents-local'
        run: npm ci --prefix "$GITHUB_WORKSPACE/dev/pi-plan-mode"

      - name: Typecheck and test
        working-directory: ${{ matrix.directory }}
        run: ${{ matrix.check }}

  required:
    name: required
    if: always()
    needs: [packages]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs passed
        env:
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: test "$PACKAGES_RESULT" = "success"
