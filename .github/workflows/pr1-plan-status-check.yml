name: Verify stale plan status handling

on:
  push:
    branches:
      - feat/stateful-code-review-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Mark changed review plans stale'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/pi-code-review/package-lock.json
      - name: Mark changed plans stale in review status
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(text: str, old: str, new: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one occurrence, found {count}: {old[:120]!r}")
              return text.replace(old, new)

          lifecycle_path = Path("dev/pi-code-review/src/lifecycle.ts")
          lifecycle = lifecycle_path.read_text()
          lifecycle = replace_exact(
              lifecycle,
              '''function nextAction(ledger: Ledger, stale: boolean): string {
            if (ledger.decision === "blocked") return "Stop for architecture/product attention or explicitly reset the session.";
            if (ledger.awaitingAdjudication) return "Inspect candidates and record parent dispositions before editing.";
            if (ledger.decision === "request-changes") return "Apply one coherent remediation commit, then run phase=auto.";
            if (ledger.decision === "incomplete") return "Fix the target/reviewer problem, then retry the same phase.";
            if (stale) return "The target changed or the worktree is dirty; commit the intended state and run phase=auto.";
            return "The reviewed committed head is complete; run required project checks before sign-off.";
          }
          ''',
              '''function nextAction(ledger: Ledger, stale: boolean, planChanged = false): string {
            if (ledger.decision === "blocked") return "Stop for architecture/product attention or explicitly reset the session.";
            if (planChanged) return "The approved plan changed after review; reapprove it and explicitly reset before another managed review.";
            if (ledger.awaitingAdjudication) return "Inspect candidates and record parent dispositions before editing.";
            if (ledger.decision === "request-changes") return "Apply one coherent remediation commit, then run phase=auto.";
            if (ledger.decision === "incomplete") return "Fix the target/reviewer problem, then retry the same phase.";
            if (stale) return "The target changed or the worktree is dirty; commit the intended state and run phase=auto.";
            return "The reviewed committed head is complete; run required project checks before sign-off.";
          }
          ''',
          )
          lifecycle = replace_exact(
              lifecycle,
              '''  const dirty = Boolean((await optionalCommand(dependencies.commands, cwd, "git", ["status", "--porcelain"], signal))?.trim());
            const stale = dirty || Boolean(currentHead && found.ledger.lastReviewedHead && currentHead !== found.ledger.lastReviewedHead);
            return { ...summary(found.ledger), ...(currentHead ? { currentHead } : {}), stale, nextAction: nextAction(found.ledger, stale) };
          }
          ''',
              '''  const dirty = Boolean((await optionalCommand(dependencies.commands, cwd, "git", ["status", "--porcelain"], signal))?.trim());
            const currentPlan = options.planPath ? await planData(options.planPath) : undefined;
            const planChanged = Boolean(options.planPath && currentPlan?.planHash !== found.ledger.planHash);
            const stale = planChanged || dirty || Boolean(currentHead && found.ledger.lastReviewedHead && currentHead !== found.ledger.lastReviewedHead);
            return { ...summary(found.ledger), ...(currentHead ? { currentHead } : {}), stale, nextAction: nextAction(found.ledger, stale, planChanged) };
          }
          ''',
          )
          lifecycle_path.write_text(lifecycle)

          test_path = Path("dev/pi-code-review/test/lifecycle.test.ts")
          tests = test_path.read_text()
          tests = replace_exact(
              tests,
              '''    await writeFile(plan, `${await readFile(plan, "utf8")}\n- Changed contract after review.\n`);

            await expect(recordReviewDispositions({
          ''',
              '''    await writeFile(plan, `${await readFile(plan, "utf8")}\n- Changed contract after review.\n`);
            const status = await getReviewStatus(repo, { commands: dependencies.commands }, {
              sessionId: initial.sessionId!,
              planPath: plan,
              target: { kind: "current-diff" },
            });
            expect(status?.stale).toBe(true);
            expect(status?.nextAction).toContain("approved plan changed");

            await expect(recordReviewDispositions({
          ''',
          )
          test_path.write_text(tests)
          Path(".github/workflows/pr1-plan-status-check.yml").unlink(missing_ok=True)
          PY
      - name: Install dependencies
        working-directory: dev/pi-code-review
        run: npm ci
      - name: Typecheck and test
        working-directory: dev/pi-code-review
        run: npm run check
      - name: Commit stale-plan status fix
        run: |
          git config user.name "Evan Huang"
          git config user.email "evanhuang117@gmail.com"
          git add dev/pi-code-review/src/lifecycle.ts dev/pi-code-review/test/lifecycle.test.ts .github/workflows
          git commit -m "Mark changed review plans stale"
          git push origin HEAD:feat/stateful-code-review-convergence
