name: Generate pi-notes lockfile

on:
  push:
    branches: [feature/pi-notes]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pi-notes

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock
        working-directory: dev/pi-notes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- dev/pi-notes/package-lock.json && git ls-files --error-unmatch dev/pi-notes/package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/pi-notes/package-lock.json
          git commit -m "build(pi-notes): add reproducible lockfile"
          git push origin HEAD:feature/pi-notes
