name: Native goal verification

on:
  push:
    branches: [feat/native-goal-local]
  pull_request:
    paths:
      - "dev/pi-goal-local/**"
      - "dev/pi-subagents-local/**"
      - "agents/GoalJudge.md"
      - "agents/GoalVerifier.md"
      - "settings.json"
      - ".github/workflows/native-goal-local.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dev/pi-subagents-local/package-lock.json

      - name: Apply required in-memory child lineage fix
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('dev/pi-subagents-local/src/agent-runner.ts')
          text = p.read_text()
          old = '      : SessionManager.inMemory(effectiveCwd);'
          new = '''      : SessionManager.inMemory(effectiveCwd, {
          parentSession:
            ctx.sessionManager?.getSessionFile?.() ??
            ctx.sessionManager?.getSessionId?.(),
        });'''
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text)
          elif new not in text:
              raise SystemExit('agent-runner lineage anchor not found')
          PY

      - name: Check pi-subagents-local
        run: |
          npm ci --prefix dev/pi-subagents-local
          npm run check --prefix dev/pi-subagents-local

      - name: Check pi-goal-local
        run: |
          npm install --prefix dev/pi-goal-local --no-package-lock
          npm run check --prefix dev/pi-goal-local

      - name: Commit lineage fix after checks
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- dev/pi-subagents-local/src/agent-runner.ts; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dev/pi-subagents-local/src/agent-runner.ts
          git commit -m "Preserve lineage for in-memory subagents"
          git push origin HEAD:feat/native-goal-local
