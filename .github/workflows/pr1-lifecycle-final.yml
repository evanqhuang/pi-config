name: Run final lifecycle verification

on:
  push:
    branches:
      - feat/stateful-code-review-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix managed review lifecycle safety'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/pi-code-review/package-lock.json
      - name: Apply final lifecycle patch
        run: |
          git show 896ee8a0ce0c8fd79efecd8e3d51cb3921b3c3ac:.github/workflows/pr1-final-lifecycle-fixes.yml > /tmp/original-workflow.yml
          git show 920a24bae6bf93aa57fda4554061dc6e98f380df:.github/workflows/pr1-final-lifecycle-apply.yml > /tmp/apply-workflow.yml
          git show 3425b924d11b7d8180e20a97c8f8fe7d6c28045a:.github/workflows/pr1-lifecycle-done.yml > /tmp/done-workflow.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/done-workflow.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Install dependencies"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              "tests = tests.replace('this.onRun = undefined;', 'delete this.onRun;', 1)",
              "# onRun has an explicit undefined union, so the existing assignment is valid",
              1,
          )
          script = script.replace(
              "Path('.github/workflows/pr1-lifecycle-done.yml').unlink(missing_ok=True)",
              "Path('.github/workflows/pr1-lifecycle-done.yml').unlink(missing_ok=True)\nPath('.github/workflows/pr1-lifecycle-final.yml').unlink(missing_ok=True)",
              1,
          )
          exec(compile(script, '<final-lifecycle-pass>', 'exec'))
          PY
      - name: Install dependencies
        working-directory: dev/pi-code-review
        run: npm ci
      - name: Typecheck and test
        working-directory: dev/pi-code-review
        run: npm run check
      - name: Verify scope and formatting
        run: |
          git diff --check
          test -z "$(git diff --name-only origin/main...HEAD -- agents/Plan.md dev/pi-plan-mode settings.json)"
      - name: Commit fixes
        run: |
          git config user.name "Evan Huang"
          git config user.email "evanhuang117@gmail.com"
          git add -A
          git commit -m "Fix managed review lifecycle safety"
          git push origin HEAD:feat/stateful-code-review-convergence
