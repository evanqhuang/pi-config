name: Remove managed PREWALK approval

on:
  push:
    branches:
      - feat/stateful-code-review-convergence

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove PREWALK from managed PLAN approval'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dev/pi-plan-mode/package-lock.json
      - name: Remove PREWALK from managed PLAN approval
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(text: str, old: str, new: str, expected: int = 1) -> str:
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"expected {expected} occurrence(s), found {actual}: {old[:120]!r}")
              return text.replace(old, new)

          def sub_once(text: str, pattern: str, replacement: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"expected one regex match, found {count}: {pattern[:120]!r}")
              return updated

          index_path = Path("dev/pi-plan-mode/index.ts")
          index = index_path.read_text()
          index = replace_exact(
              index,
              "YOLO for localized/tightly coupled work, ORCHESTRATOR for independent slices or parallel work, and PREWALK only when guided exploration is specifically useful;",
              "YOLO for localized/tightly coupled work and ORCHESTRATOR for independent slices or parallel work;",
          )
          index = replace_exact(index, '  "Implement with PREWALK": "prewalk",\n', "")
          index = replace_exact(index, "(YOLO|ORCHESTRATOR|PREWALK)", "(YOLO|ORCHESTRATOR)", 2)
          index = replace_exact(index, '    { recommendation: "PREWALK" as const, pattern: /(?:^|[\\n*#-])\\s*(?:prewalk|checklist[- ]first|walkthrough[- ]first|guided\\s+exploration)\\b/i, signal: "explicit:prewalk" },\n', "")
          index = replace_exact(
              index,
              '  const recommendedMode = modeValue === "YOLO" || modeValue === "ORCHESTRATOR" || modeValue === "PREWALK"\n',
              '  const recommendedMode = modeValue === "YOLO" || modeValue === "ORCHESTRATOR"\n',
          )
          index = replace_exact(index, '    "PREWALK: runs the external prewalk checklist/executor and does not switch this parent session\'s mode.",\n', "")
          index = replace_exact(
              index,
              'recommendedMode: { type: "string", enum: ["YOLO", "ORCHESTRATOR", "PREWALK"], description: "Optional bounded display recommendation signal; never approval" },',
              'recommendedMode: { type: "string", enum: ["YOLO", "ORCHESTRATOR"], description: "Optional bounded display recommendation signal; never approval" },',
          )
          index_path.write_text(index)

          test_path = Path("dev/pi-plan-mode/test/extension.test.mjs")
          tests = test_path.read_text()
          tests = sub_once(
              tests,
              r'\n  const prewalkPath = await createDraft\("# Prewalk plan.*?\n\n  const block = await pi\.handlers\.get\("tool_call"\)',
              '\n\n  const block = await pi.handlers.get("tool_call")',
          )
          tests = replace_exact(
              tests,
              '  assert.match(ctx.selectCalls.at(-1).title, /PREWALK:/);',
              '  assert.doesNotMatch(ctx.selectCalls.at(-1).title, /PREWALK:/);\n  assert.equal(ctx.selectCalls.at(-1).options.some((option) => /PREWALK/.test(option)), false);',
          )
          tests = replace_exact(
              tests,
              'test("resume executes each approved action once, including compact callbacks and PREWALK", async (t) => {',
              'test("resume executes each managed YOLO/ORCHESTRATOR action once, including compact callbacks", async (t) => {',
          )
          tests = sub_once(
              tests,
              r'\n  const launcher = join\(root, "prewalk"\);.*?\n\n  const actions = \[',
              '\n\n  const actions = [',
          )
          tests = replace_exact(tests, '    ["prewalk", undefined],\n', "")
          tests = sub_once(
              tests,
              r'\n    \} else if \(action === "prewalk"\) \{.*?\n    \} else \{',
              '\n    } else {',
          )
          tests = replace_exact(
              tests,
              '    assert.equal(pi.sentMessages.length, action === "prewalk" ? 0 : 1, `${action} is idempotent`);',
              '    assert.equal(pi.sentMessages.length, 1, `${action} is idempotent`);',
          )
          test_path.write_text(tests)

          readme_path = Path("dev/pi-plan-mode/README.md")
          readme = readme_path.read_text()
          readme = replace_exact(readme, '`recommendedMode` (`YOLO`, `ORCHESTRATOR`, or `PREWALK`)', '`recommendedMode` (`YOLO` or `ORCHESTRATOR`)')
          readme = replace_exact(readme, '`Parent recommendation: ORCHESTRATOR` (or `PREWALK`/`YOLO`)', '`Parent recommendation: ORCHESTRATOR` (or `YOLO`)')
          readme = replace_exact(readme, 'before any mode switch, compaction request, or PREWALK launch;', 'before any mode switch or compaction request;')
          readme = replace_exact(
              readme,
              'through the shared executor for all five actions (YOLO/ORCHESTRATOR direct or compact, plus PREWALK),',
              'through the shared executor for all four managed actions (YOLO/ORCHESTRATOR direct or compact),',
          )
          readme += '\nManaged plan approval intentionally offers only YOLO and ORCHESTRATOR. PREWALK remains available only as a separately invoked manual tool and is not a managed-plan execution route.\n'
          readme_path.write_text(readme)

          Path(".github/workflows/pr1-inspect-prewalk.yml").unlink(missing_ok=True)
          Path(".github/workflows/pr1-remove-managed-prewalk.yml").unlink(missing_ok=True)
          PY
      - name: Install plan-mode dependencies
        working-directory: dev/pi-plan-mode
        run: npm ci
      - name: Typecheck and run portable plan-mode tests
        working-directory: dev/pi-plan-mode
        run: |
          npm run typecheck
          node --test test/orchestrator-reminder.test.mjs test/reminder.test.mjs test/policy.test.mjs
      - name: Verify managed PREWALK is unreachable
        run: |
          ! grep -q '"Implement with PREWALK": "prewalk"' dev/pi-plan-mode/index.ts
          ! grep -q 'recommendedMode:.*"PREWALK"' dev/pi-plan-mode/index.ts
          grep -q 'doesNotMatch(ctx.selectCalls.at(-1).title, /PREWALK:/)' dev/pi-plan-mode/test/extension.test.mjs
      - name: Commit managed PREWALK removal
        run: |
          git config user.name "Evan Huang"
          git config user.email "evanhuang117@gmail.com"
          git add dev/pi-plan-mode/index.ts dev/pi-plan-mode/test/extension.test.mjs dev/pi-plan-mode/README.md .github/workflows
          git commit -m "Remove PREWALK from managed PLAN approval"
          git push origin HEAD:feat/stateful-code-review-convergence
